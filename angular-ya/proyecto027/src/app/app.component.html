<table mat-table [dataSource]="datos" class="mat-elevation-z8" #tabla1>
  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef> Código </th>
    <td mat-cell *matCellDef="let articulo">{{ articulo.codigo }}</td>
  </ng-container>
  <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef> Descripción </th>
    <td mat-cell *matCellDef="let articulo">{{ articulo.descripcion }}</td>
  </ng-container>
  <ng-container matColumnDef="precio">
    <th mat-header-cell *matHeaderCellDef> Precio </th>
    <td mat-cell *matCellDef="let articulo">{{ articulo.precio }}</td>
  </ng-container>
  <ng-container matColumnDef="borrar">
    <th mat-header-cell *matHeaderCellDef> Borrar? </th>
    <td mat-cell *matCellDef="let j = index">
      <button mat-raised-button color="warn" focusable="false" (click)="borrarFila(j)">Borrar</button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>
<div class="contenedor">
  <mat-form-field>
    <mat-label>Código</mat-label>
    <input matInput [(ngModel)] = "articuloselect.codigo" typer="number" placeholder="Ingrese código">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Descripción</mat-label>
    <input matInput [(ngModel)] = "articuloselect.descripcion" typer="text" placeholder="Ingrese descripcion">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Precio</mat-label>
    <input matInput [(ngModel)] = "articuloselect.precio" typer="number" placeholder="Ingrese precio">
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="agregar()">Agregar</button>
</div>
